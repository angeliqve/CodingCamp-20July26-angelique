<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <button id="theme-toggle" type="button"
            aria-pressed="false"
            aria-label="Switch to dark mode"
            class="theme-toggle">
      <span aria-hidden="true" class="theme-icon">🌙</span>
    </button>
    <div id="notification-banner" role="alert" aria-live="polite" hidden></div>

    <main class="app-grid">
      <section class="card form-section">
        <h2>Add Expense</h2>
        <form id="transaction-form" novalidate>
          <div class="field">
            <label for="item-name">Item</label>
            <input id="item-name" type="text" maxlength="100" required />
            <span class="error" id="err-name" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="amount">Amount</label>
            <input id="amount" type="number" step="0.01" min="0.01" required />
            <span class="error" id="err-amount" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="">-- Select --</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
            <span class="error" id="err-category" aria-live="polite"></span>
          </div>
          <button type="submit">Add Expense</button>
        </form>
      </section>

      <section id="category-manager" class="card category-manager-section">
        <h2>Manage Categories</h2>
        <div class="field">
          <label for="new-category-name">New Category Name</label>
          <input id="new-category-name" type="text" maxlength="30"
                 placeholder="e.g. Groceries" />
          <span class="error" id="err-category-name" aria-live="polite"></span>
        </div>
        <button type="button" id="add-category-btn">Add Category</button>
        <ul id="category-list" aria-label="Custom categories"></ul>
      </section>

      <section class="card balance-section">
        <h2>Total Spending</h2>
        <p id="balance-display">$0.00</p>
      </section>

      <section class="card chart-section">
        <h2>Spending by Category</h2>
        <div id="chart-container">
          <canvas id="spending-chart"></canvas>
          <p id="chart-placeholder" hidden>No data available.</p>
        </div>
      </section>

      <section class="card list-section">
        <h2>Transactions</h2>
        <div class="month-filter-row">
          <label for="month-selector">Filter by Month</label>
          <select id="month-selector">
            <option value="all">All</option>
          </select>
          <span id="month-total" class="month-total"></span>
        </div>
        <div class="sort-row">
          <label for="sort-control">Sort by</label>
          <select id="sort-control">
            <option value="date-desc">Date (newest first)</option>
            <option value="date-asc">Date (oldest first)</option>
            <option value="amount-desc">Amount (high to low)</option>
            <option value="amount-asc">Amount (low to high)</option>
            <option value="category-asc">Category (A–Z)</option>
            <option value="category-desc">Category (Z–A)</option>
          </select>
        </div>
        <ul id="transaction-list" aria-label="Transaction history"></ul>
      </section>

      <section id="threshold-panel" class="card threshold-section">
        <h2>Budget Thresholds</h2>
        <p class="threshold-hint">Set a limit of 0 to disable.</p>
        <div id="threshold-list">
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
